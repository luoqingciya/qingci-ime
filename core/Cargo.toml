[package]
name = "qingci-core"
version = "0.1.0"
edition = "2021"
description = "Qingci (清辞) Chinese pinyin input method core engine"
license = "MIT"

[lib]
name = "qingci_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "qingcli"
path = "src/bin/qingcli.rs"

[[bin]]
name = "qingdict-gen"
path = "src/bin/qingdict_gen.rs"

[profile.release]
opt-level = 3
lto = true
