name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build & Package (Linux amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake extra-cmake-modules \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev

      - name: Show toolchain versions
        run: |
          rustc --version
          cargo --version
          cmake --version
          pkg-config --modversion Fcitx5Core || true

      - name: Test core engine
        run: cargo test --manifest-path core/Cargo.toml

      - name: Build core engine (release)
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Build Fcitx5 addon
        run: |
          cmake -B addon/build -S addon \
            -DQINGCI_CORE_STATIC_LIB="$PWD/core/target/release/libqingci_core.a" \
            -DQINGCI_CORE_DICT_PATH="$PWD/core/data/qingci.dic" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build addon/build -j"$(nproc)"

      - name: Stage install tree & package
        run: |
          cmake --install addon/build --prefix pkg/usr
          cp README.md LICENSE pkg/
          mkdir -p pkg/usr/share/doc/qingci-ime
          cp docs/BUILD-UBUNTU.md pkg/usr/share/doc/qingci-ime/
          tar -czf "qingci-ime-${GITHUB_REF_NAME#refs/}-linux-amd64.tar.gz" -C pkg .
          tar -tzf "qingci-ime-${GITHUB_REF_NAME#refs/}-linux-amd64.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingci-ime-package
          path: "*.tar.gz"
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "青瓷拼音 $GITHUB_REF_NAME" \
            --generate-notes \
            *.tar.gz
